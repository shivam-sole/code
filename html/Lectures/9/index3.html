<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 3</title>
</head>
<body>
    <table border="1">
        <caption>Monthly Expense Report</caption>
        <thead>
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Amount(₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Groceries</td>
                <td>Essentials</td>
                <td>3500</td>
            </tr>
            <tr>
                <td>Internet Bill</td>
                <td>Utilities</td>
                <td>999</td>
            </tr>
            <tr>
                <td>Movie Night</td>
                <td>Entertentment</td>
                <td>600</td>
            </tr>
            <tr>
                <td colspan="2"> Total</td>
                <td>5099</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
